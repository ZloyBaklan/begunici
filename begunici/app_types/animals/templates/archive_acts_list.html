{% extends 'base.html' %}
{% load static %}

{% block title %}Акты выбытия{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="row mb-4">
        <div class="col-12">
            <h1 class="mb-3">Акты выбытия (СП-54)</h1>
        </div>
    </div>

    <div class="row">
        <div class="col-12 mb-4">
            <div class="card">
                <div class="card-header">
                    <div class="row align-items-end g-3">
                        <div class="col-lg-4">
                            <h5 class="card-title mb-0">Архивированные животные</h5>
                        </div>
                        <div class="col-lg-5">
                            <label for="archive-acts-search" class="form-label">Поиск:</label>
                            <input type="text" id="archive-acts-search" class="form-control" placeholder="Поиск по бирке, бирке РСХН, статусу...">
                        </div>
                        <div class="col-lg-3">
                            <button type="button" class="btn btn-primary w-100" onclick="performArchiveActsSearch()">
                                Поиск
                            </button>
                        </div>
                    </div>
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-striped table-hover">
                            <thead class="table-light">
                                <tr>
                                    <th width="8%">№</th>
                                    <th width="24%">Бирка</th>
                                    <th width="24%">Статус</th>
                                    <th width="20%">Дата статуса</th>
                                    <th width="24%">Действия</th>
                                </tr>
                            </thead>
                            <tbody id="archive-acts-list"></tbody>
                        </table>
                    </div>

                    <div id="pagination" class="mt-3"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
.table th {
    border-top: none;
    font-weight: 600;
}

.table td {
    vertical-align: middle;
}

.card-header {
    background-color: #f8f9fa;
    border-bottom: 1px solid #dee2e6;
}

#pagination {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
}
</style>

<script type="module" src="{% static 'js/archive_acts.js' %}"></script>
{% endblock %}
