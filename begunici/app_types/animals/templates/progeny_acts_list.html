{% extends 'base.html' %}
{% load static %}

{% block title %}Акты на оприходование приплода{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="row mb-4">
        <div class="col-12">
            <div class="d-flex align-items-center justify-content-between flex-wrap gap-2">
                <h1 class="mb-0">Акты на оприходование приплода животных (СП-39)</h1>
                <a href="{% url 'animals:acts' %}" class="btn btn-outline-secondary">
                    К списку актов
                </a>
            </div>
        </div>
    </div>

    <div class="row">
        <div class="col-12 mb-4">
            <div class="card">
                <div class="card-header">
                    <h5 class="card-title mb-0">Список актов по месяцам</h5>
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-striped table-hover">
                            <thead class="table-light">
                                <tr>
                                    <th width="12%">№ Акта</th>
                                    <th width="18%">Месяц</th>
                                    <th width="14%">Год</th>
                                    <th width="20%">Количество окотов</th>
                                    <th width="20%">Количество приплода</th>
                                    <th width="16%">Действие</th>
                                </tr>
                            </thead>
                            <tbody id="progeny-acts-list"></tbody>
                        </table>
                    </div>

                    <div id="pagination" class="mt-3"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
.table th {
    border-top: none;
    font-weight: 600;
}

.table td {
    vertical-align: middle;
}

.card-header {
    background-color: #f8f9fa;
    border-bottom: 1px solid #dee2e6;
}

#pagination {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
}
</style>

<script type="module" src="{% static 'js/progeny_acts.js' %}"></script>
{% endblock %}
