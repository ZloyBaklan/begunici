{% extends 'base.html' %}{% load static %}
{% block title %}Номенклатура · Бегуницы{% endblock %}
{% block content %}
<link rel="stylesheet" href="{% static 'inventory/inventory.css' %}?v=7">
<div class="inventory container mt-4" id="inventory-app">
    {% for message in messages %}<div class="alert {% if message.tags == 'error' %}alert-danger{% else %}alert-success{% endif %}" role="alert">{{ message }}</div>{% endfor %}
    <div class="card iv-content-card">{% block inventory_content %}{% endblock %}</div>
</div>
{% endblock %}
