<dl class="iv-snapshot">
{% for field in snapshot_display.fields %}
    <dt>{{ field.label }}</dt>
    <dd>{% if field.is_boolean %}<input type="checkbox" class="form-check-input iv-flag" disabled{% if field.value %} checked{% endif %} aria-label="{{ field.label }}: {% if field.value %}Да{% else %}Нет{% endif %}">{% else %}{{ field.value }}{% endif %}{% if field.note %}<small class="text-muted d-block">{{ field.note }}</small>{% endif %}</dd>
{% endfor %}
</dl>
