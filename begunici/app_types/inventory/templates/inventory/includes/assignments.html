<div class="d-flex flex-wrap gap-2">
    {% if snapshot.is_reject %}<span class="badge bg-warning text-dark">Брак</span>{% endif %}
    {% if snapshot.is_for_sale %}<span class="badge bg-primary text-white">К продаже</span>{% endif %}
    {% if not snapshot.is_reject and not snapshot.is_for_sale %}<span class="text-muted">Не назначено</span>{% endif %}
</div>
