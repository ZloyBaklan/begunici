<div class="card mb-4 iv-warehouse-navigation">
    <div class="card-header iv-heading"><span>Складской учёт</span><span class="text-muted small">Учёт с 01.10.2026</span></div>
    <nav class="card-body iv-nav" aria-label="Разделы складского учёта">
        {% if finance %}
        <a class="btn btn-outline-secondary" href="{% url 'inventory:home' %}">Все разделы учёта</a>
        <a class="btn {% if area == 'products' %}btn-secondary{% else %}btn-outline-secondary{% endif %}" href="{% url 'inventory:stock' %}"{% if area == 'products' %} aria-current="page"{% endif %}>Склад продукции и животных</a>
        <a class="btn {% if area == 'feeds' %}btn-secondary{% else %}btn-outline-secondary{% endif %}" href="{% url 'feed_inventory:home' %}"{% if area == 'feeds' %} aria-current="page"{% endif %}>Склад кормов</a>
        {% endif %}
        {% if veterinary %}<a class="btn {% if area == 'vet' %}btn-secondary{% else %}btn-outline-secondary{% endif %}" href="{% url 'vet_inventory:home' %}"{% if area == 'vet' %} aria-current="page"{% endif %}>Склад ветпрепаратов</a>{% endif %}
    </nav>
</div>
