<nav class="d-flex flex-wrap justify-content-center align-items-center gap-3 mt-3" aria-label="Страницы списка">
    {% if page_obj.has_previous %}<a class="btn btn-outline-primary btn-sm" href="?{% if pagination_query %}{{ pagination_query }}&amp;{% endif %}page={{ page_obj.previous_page_number }}">Предыдущая</a>{% endif %}
    <span class="text-muted text-center">Страница {{ page_obj.number }} из {{ page_obj.paginator.num_pages }} (всего{% if pagination_unit %} {{ pagination_unit }}{% endif %}: {{ page_obj.paginator.count }})</span>
    {% if page_obj.has_next %}<a class="btn btn-outline-primary btn-sm" href="?{% if pagination_query %}{{ pagination_query }}&amp;{% endif %}page={{ page_obj.next_page_number }}">Следующая</a>{% endif %}
</nav>
